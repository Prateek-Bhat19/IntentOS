version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wishlist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache & Queue
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  # Backend API
  backend:
    build:
      context: ./wishlist-backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: postgres://user:password@postgres:5432/wishlist?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret
      ENABLE_REAL_ADAPTERS: "true"

  # Frontend App
  frontend:
    build:
      context: ./wishlist-frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  # BullMQ Worker (metadata + price fetching)
  worker:
    build:
      context: ./wishlist-backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://user:password@postgres:5432/wishlist?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_secret
      ENABLE_REAL_ADAPTERS: "true"
    command: ["node", "dist/workers/buy.worker.js"]

volumes:
  postgres_data:
